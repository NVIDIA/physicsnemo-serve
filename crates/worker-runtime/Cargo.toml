[package]
name = "worker-runtime"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Config-driven worker runtime for Rust based inference"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/physicsnemo-serve"
keywords = ["worker", "redis", "streams", "runtime", "scheduler"]
categories = ["asynchronous", "science"]
readme = "README.md"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs = "5"
futures = "0.3"
reqwest = { version = "0.12", features = ["http2", "json", "rustls-tls-native-roots", "stream"], default-features = false }
scicomp-rq = { path = "../scicomp-rq" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
redis.workspace = true
uuid.workspace = true
nvml-wrapper.workspace = true
prometheus-client.workspace = true
object_store = { workspace = true, features = ["aws", "azure"] }
fs2 = "0.4.3"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
