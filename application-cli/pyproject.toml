[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicsnemo-serve-app"
version = "0.1.0"
description = "Application development, native compilation and serving for PhysicsNeMo Serve"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.26", "redis>=5"]

[project.scripts]
pnms = "pnms_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
