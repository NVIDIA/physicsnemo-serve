[package]
name = "e2s_zarr_io"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Rust-backed Zarr IO backend for Earth2Studio"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/physicsnemo-serve"
readme = "README.md"
rust-version = "1.85"
keywords = ["zarr", "earth2studio", "rust", "python"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-bindings = ["dep:pyo3"]
python-extension-module = ["python-bindings", "pyo3/extension-module"]
test-utils = []

[dependencies]
pyo3 = { workspace = true, features = ["abi3-py311"], optional = true }
libc = "0.2"
rayon = "1.10"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
thiserror = "2.0.18"
indexmap = "2.14.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "buffer_pool_latency"
harness = false

[[bench]]
name = "write_copy_barrier_latency"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "add_array_latency"
harness = false
