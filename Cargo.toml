[workspace]
members = [
    "crates/e2s_zarr_io",
    "crates/scicomp-rq",
    "crates/inference_server",
    "crates/worker-runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["NVIDIA Corporation"]
license = "Apache-2.0"

[workspace.dependencies]
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "signal", "time", "process"] }
tracing = "0.1"
pyo3 = "0.28"
pyo3-async-runtimes = "0.28"
uuid = { version = "1", features = ["v4"] }
jsonschema = "0.27"
once_cell = "1"
parking_lot = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
nvml-wrapper = "0.10"
prometheus-client = "0.23"
sysinfo = "0.38"
object_store = "0.14.0"
