name: CI

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    name: Rust Format
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      # TODO: update to latest stable once GitLab CI is also upgraded
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          components: rustfmt
          cache: false
      - run: cargo fmt --check

  rust-clippy:
    name: Rust Clippy
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          components: clippy
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - run: cargo clippy -- -D warnings

  rust-build:
    name: Rust Build
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          cache: false
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - run: cargo build
      - name: Build PhysicsNeMo Serve CLI binary
        run: make build-serve-cmd
      - name: Build self-contained PhysicsNeMo Serve CLI binary
        run: make build-serve-cmd-self-contained

  rust-test:
    name: Rust Test
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Install system dependencies
        run: |
          # Avoid package download failures from the regional EC2 mirror.
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i -E 's|https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' {} +
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libssl-dev pkg-config python3 python3-yaml redis-server
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python
      - run: cargo test

  python-lint:
    name: Python Lint
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  python-test:
    name: Python Tests
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/python/e2s_tools
        # Backend compilation checks run in inference-cpu with CMake installed.
        run: >-
          uv run pytest tests python/e2s_tools qa/scripts/test_rust_io_benchmark.py
          --ignore=tests/test_native_image_backends.py -v

  inference-cpu:
    name: Model Builder and Native SDK CPU
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          cache: false
      - name: Install CPU build dependencies
        run: |
          # Avoid package download failures from the regional EC2 mirror.
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i -E 's|https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' {} +
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential ca-certificates cmake curl libssl-dev nlohmann-json3-dev pkg-config python3 python3-venv redis-server
      - name: Prepare isolated builder packaging environment
        run: |
          python3 -m venv "$RUNNER_TEMP/inference-packaging-venv"
          "$RUNNER_TEMP/inference-packaging-venv/bin/python" -m pip install setuptools==80.9.0 wheel==0.48.0 packaging==25.0
          mkdir -p "$RUNNER_TEMP/inference-cpu-evidence"
      - name: Run builder contract tests without ML frameworks
        run: |
          set -euo pipefail
          python3 -S -m unittest discover -s native-inference/model-builder/tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/builder-tests.log"
      - name: Test workflow CLI and install contracts without CUDA
        run: |
          set -euo pipefail
          python3 -S -m unittest discover -s native-inference/workflows/transolver/tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/workflow-output-tests.log"
      - name: Test native CFD seeds and exact block plans without CUDA
        run: |
          set -euo pipefail
          cmake -S native-inference/workflows/transolver/tests/cpu -B "$RUNNER_TEMP/transolver-contract"
          cmake --build "$RUNNER_TEMP/transolver-contract" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/transolver-contract" --output-on-failure --no-tests=error \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/transolver-contract-tests.log"
      - name: Prepare isolated exact graph test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/inference-graph-venv"
          "$RUNNER_TEMP/inference-graph-venv/bin/python" -m pip install numpy==2.1.0 onnx==1.18.0 pytest==8.3.5
      - name: Test native authoring and sealed release CPU contracts
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/inference-graph-venv/bin/python" -m pip install PyYAML==6.0.3 jsonschema==4.26.0
          "$RUNNER_TEMP/inference-graph-venv/bin/python" -m pytest \
            tests/test_native_authoring.py tests/test_native_user_cli.py tests/test_native_user_release.py \
            tests/test_native_release*.py tests/test_native_lepton_components.py \
            tests/test_native_workflow_release_ci.py tests/test_native_image_backends.py \
            tests/test_native_image_build.py \
            tests/test_native_http*.py tests/test_native_cfd*.py \
            tests/test_run_lepton_native_cfd.py tests/test_export_native_cfd_release.py \
            qa/scripts/test_create_native_raw_variant.py \
            -q -o xfail_strict=true \
            --junitxml="$RUNNER_TEMP/inference-cpu-evidence/native-release-contract-tests.xml" \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/native-release-contract-tests.log"
      - name: Test Python image Cargo planner
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/inference-graph-venv/bin/python" -m pytest \
            native-inference/tests/test_python_image_planner.py \
            -v --junitxml="$RUNNER_TEMP/inference-cpu-evidence/python-image-planner-tests.xml" \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/python-image-planner-tests.log"
      - name: Test unified pnms CPU contracts
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/inference-graph-venv/bin/python" -m pip install redis==6.4.0 pydantic==2.12.5
          "$RUNNER_TEMP/inference-graph-venv/bin/python" -m pytest \
            tests/test_pnms*.py -q -o xfail_strict=true \
            --junitxml="$RUNNER_TEMP/inference-cpu-evidence/pnms-contract-tests.xml" \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/pnms-contract-tests.log"
      - name: Run exact TensorRT graph tests on CPU
        env:
          PYTHONPATH: ${{ github.workspace }}/native-inference/model-builder/src
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/inference-graph-venv/bin/python" -m pytest \
            native-inference/model-builder/tests/test_tensorrt_exact_graphs.py \
            native-inference/model-builder/tests/test_tensorrt_deslice_graphs.py \
            native-inference/model-builder/tests/test_tensorrt_domino_graphs.py \
            native-inference/model-builder/tests/test_tensorrt_weighted_blend.py \
            -v --junitxml="$RUNNER_TEMP/inference-cpu-evidence/exact-graph-tests.xml" \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/exact-graph-tests.log"
      - name: Build and verify the installed builder wheel
        run: |
          set -euo pipefail
          cp -a native-inference/model-builder "$RUNNER_TEMP/inference-wheel-source"
          "$RUNNER_TEMP/inference-packaging-venv/bin/python" -m pip wheel \
            --no-deps --no-build-isolation --no-index \
            --wheel-dir "$RUNNER_TEMP/inference-cpu-evidence/wheels" "$RUNNER_TEMP/inference-wheel-source"
          set -- "$RUNNER_TEMP/inference-cpu-evidence/wheels/"*.whl
          test "$#" -eq 1
          test -f "$1"
          export PNMIR_TEST_WHEEL="$1"
          "$RUNNER_TEMP/inference-packaging-venv/bin/python" -m unittest discover \
            -s native-inference/model-builder/tests/installation -p 'test_installed*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/installed-wheel-tests.log"
      - name: Test builder environment qualification guards
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/inference-packaging-venv/bin/python" -m unittest discover \
            -s native-inference/model-builder/tests/images -p 'test_builder_image*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/builder-image-tests.log"
      - name: Build and test the core C++ SDK
        run: |
          set -euo pipefail
          cmake -S native-inference -B "$RUNNER_TEMP/inference-core-build" \
            -DCMAKE_BUILD_TYPE=Release -DPNMIR_BUILD_TESTS=ON \
            -DPNMIR_ENABLE_AOTI=OFF -DPNMIR_ENABLE_ONNXRUNTIME=OFF -DPNMIR_ENABLE_TENSORRT=OFF
          cmake --build "$RUNNER_TEMP/inference-core-build" --parallel 4
          ctest --test-dir "$RUNNER_TEMP/inference-core-build" --output-on-failure --no-tests=error \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/core-sdk-tests.log"
      - name: Test reusable native tensor and custom workflow host on CPU
        run: |
          set -euo pipefail
          cmake --install "$RUNNER_TEMP/inference-core-build" --prefix "$RUNNER_TEMP/inference-sdk"
          cmake -S native-inference/workflows/runtime -B "$RUNNER_TEMP/workflow-host-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/inference-sdk" \
            -DPNMS_CUSTOM_WORKFLOW_SOURCE_DIR="$GITHUB_WORKSPACE/native-inference/workflows/runtime/tests/custom" \
            -DPNMS_CUSTOM_WORKFLOW_TARGET=pnms_test_custom
          cmake --build "$RUNNER_TEMP/workflow-host-build" --parallel 4
          ctest --test-dir "$RUNNER_TEMP/workflow-host-build" --output-on-failure --no-tests=error \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/workflow-host-tests.log"
      - name: Test installed workflow consumer and standalone runner
        run: |
          set -euo pipefail
          cmake --install "$RUNNER_TEMP/workflow-host-build" --prefix "$RUNNER_TEMP/workflow-host"
          cmake -S native-inference/workflows/runtime/tests/install_consumer \
            -B "$RUNNER_TEMP/workflow-consumer-build" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/workflow-host;$RUNNER_TEMP/inference-sdk"
          cmake --build "$RUNNER_TEMP/workflow-consumer-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/workflow-consumer-build" --output-on-failure --no-tests=error \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/workflow-consumer-tests.log"
          python3 -S native-inference/workflows/runtime/tests/cli_test.py \
            --runner "$RUNNER_TEMP/workflow-host/bin/pnms-native-run" \
            --config "$RUNNER_TEMP/workflow-consumer-build/config.json" -v \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/workflow-cli-tests.log"
      - name: Test Rust native worker with the installed CPU workflow host
        env:
          NATIVE_WORKFLOW_ONLY: "1"
          NATIVE_WORKFLOW_INCLUDE: ${{ runner.temp }}/workflow-host/include
          NATIVE_WORKFLOW_LIB_DIR: ${{ runner.temp }}/workflow-host/lib
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/workflow-host/lib:$RUNNER_TEMP/inference-sdk/lib:${LD_LIBRARY_PATH:-}"
          cargo test --locked -p native-worker --features cpp -- --test-threads=2 \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/native-worker-cpp-tests.log"
      - name: Prepare ONNX Runtime CPU SDK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/microsoft/onnxruntime/releases/download/v1.27.1/onnxruntime-linux-x64-1.27.1.tgz \
            --output "$RUNNER_TEMP/onnxruntime-linux-x64-1.27.1.tgz"
          printf '%s  %s\n' \
            25b1ef1fea1acd210d63f8f24dc870ad6e077795ce1f54876252c6d3803c15af \
            "$RUNNER_TEMP/onnxruntime-linux-x64-1.27.1.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/onnxruntime-linux-x64-1.27.1.tgz" -C "$RUNNER_TEMP"
      - name: Test installed ONNX Runtime SDK consumers
        run: |
          set -euo pipefail
          python3 -S native-inference/cpp-runtime/tests/install_consumer.py \
            --sdk-source native-inference/cpp-runtime --component onnxruntime \
            --onnxruntime-root "$RUNNER_TEMP/onnxruntime-linux-x64-1.27.1" \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/onnxruntime-static-consumer.log"
          python3 -S native-inference/cpp-runtime/tests/install_consumer.py \
            --sdk-source native-inference/cpp-runtime --component onnxruntime --shared \
            --onnxruntime-root "$RUNNER_TEMP/onnxruntime-linux-x64-1.27.1" \
            2>&1 | tee "$RUNNER_TEMP/inference-cpu-evidence/onnxruntime-shared-consumer.log"
      - name: Preserve CPU qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inference-cpu-${{ github.sha }}
          path: |
            ${{ runner.temp }}/inference-cpu-evidence/
            ${{ runner.temp }}/inference-core-build/Testing/Temporary/LastTest.log

  inference-windows:
    name: Model Builder and Native SDK Windows CPU
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_GENERATOR_PLATFORM: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare Windows qualification evidence and symlink support
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/inference-windows-evidence"
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' `
            -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Run portable builder contract tests without ML frameworks
        working-directory: native-inference/model-builder/tests
        run: |
          python -S -m unittest test_cli test_project_targets test_tensor_contracts `
            test_windows_frontend test_setup_env_cli test_init_scaffold test_cuda_environment `
            test_json_output -v 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/builder-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test the core C++ SDK with MSVC
        run: |
          cmake -S native-inference -B "$env:RUNNER_TEMP/inference-windows-build" `
            -A x64 -DPNMIR_BUILD_TESTS=ON `
            -DPNMIR_ENABLE_AOTI=OFF -DPNMIR_ENABLE_ONNXRUNTIME=OFF -DPNMIR_ENABLE_TENSORRT=OFF `
            "-DPython3_EXECUTABLE=$((Get-Command python).Source)" 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CMAKE_GENERATOR = (Select-String -Path "$env:RUNNER_TEMP/inference-windows-build/CMakeCache.txt" `
            -Pattern '^CMAKE_GENERATOR:INTERNAL=').Line -replace '^CMAKE_GENERATOR:INTERNAL=', ''
          "CMAKE_GENERATOR=$env:CMAKE_GENERATOR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cmake --build "$env:RUNNER_TEMP/inference-windows-build" --config Release --parallel 4 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/inference-windows-build" -C Release `
            --output-on-failure --no-tests=error 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/core-sdk-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test reusable native tensor and custom workflow host on Windows
        run: |
          cmake --install "$env:RUNNER_TEMP/inference-windows-build" --config Release `
            --prefix "$env:RUNNER_TEMP/inference-windows-sdk" 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/sdk-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S native-inference/workflows/runtime -B "$env:RUNNER_TEMP/workflow-host-windows-build" `
            -A x64 -DBUILD_TESTING=ON -DPNMS_ENABLE_MOCK_BACKEND=ON `
            "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/inference-windows-sdk" `
            "-DPNMS_CUSTOM_WORKFLOW_SOURCE_DIR=$env:GITHUB_WORKSPACE/native-inference/workflows/runtime/tests/custom" `
            -DPNMS_CUSTOM_WORKFLOW_TARGET=pnms_test_custom 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/workflow-host-configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/workflow-host-windows-build" --config Release --parallel 4 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/workflow-host-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/workflow-host-windows-build" -C Release `
            --output-on-failure --no-tests=error 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/workflow-host-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installed Windows workflow consumer and standalone runner
        run: |
          cmake --install "$env:RUNNER_TEMP/workflow-host-windows-build" --config Release `
            --prefix "$env:RUNNER_TEMP/workflow-host-windows" 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/workflow-host-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S native-inference/workflows/runtime/tests/install_consumer `
            -B "$env:RUNNER_TEMP/workflow-consumer-windows-build" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/workflow-host-windows;$env:RUNNER_TEMP/inference-windows-sdk" 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/workflow-consumer-configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/workflow-consumer-windows-build" --config Release --parallel 2 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/workflow-consumer-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP/workflow-host-windows/bin;$env:RUNNER_TEMP/inference-windows-sdk/bin;$env:PATH"
          ctest --test-dir "$env:RUNNER_TEMP/workflow-consumer-windows-build" -C Release `
            --output-on-failure --no-tests=error 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/workflow-consumer-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -S native-inference/workflows/runtime/tests/cli_test.py `
            --runner "$env:RUNNER_TEMP/workflow-host-windows/bin/pnms-native-run.exe" `
            --config "$env:RUNNER_TEMP/workflow-consumer-windows-build/config.json" -v 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/workflow-cli-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native CFD seeds and exact block plans on Windows
        run: |
          cmake -S native-inference/workflows/transolver/tests/cpu `
            -B "$env:RUNNER_TEMP/transolver-windows-contract" -A x64 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/transolver-contract-configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/transolver-windows-contract" --config Release --parallel 2 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/transolver-contract-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/transolver-windows-contract" -C Release `
            --output-on-failure --no-tests=error 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-evidence/transolver-contract-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inference-windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/inference-windows-evidence/
            ${{ runner.temp }}/inference-windows-build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/workflow-host-windows-build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/workflow-consumer-windows-build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/transolver-windows-contract/Testing/Temporary/LastTest.log

  inference-windows-aoti:
    name: Native SDK Windows AOTI CPU
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install the CPU AOTI producer and native dependencies
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/inference-windows-aoti-evidence"
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install numpy==2.1.0 ninja==1.13.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $torchLib = python -c 'from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / "lib")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $torchLib | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test native inference examples on CPU
        run: |
          python -m unittest discover -s native-inference/tests/examples -p 'test_*.py' -v 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-aoti-evidence/example-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and qualify CPU AOTI with MSVC
        run: |
          cmake -S native-inference/cpp-runtime -B "$env:RUNNER_TEMP/inference-windows-aoti-build" `
            -DCMAKE_BUILD_TYPE=Release -DPNMIR_BUILD_TESTS=ON -DPNMIR_ENABLE_AOTI=ON `
            -DPNMIR_ENABLE_ONNXRUNTIME=OFF -DPNMIR_ENABLE_TENSORRT=OFF `
            "-DPython3_EXECUTABLE=$((Get-Command python).Source)" 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-aoti-evidence/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/inference-windows-aoti-build" --config Release --parallel 4 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-aoti-evidence/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/inference-windows-aoti-build" -C Release `
            -R '^pnmir_(aoti_integration|aoti_(owned|dynamic)_outputs_cpu|install_aoti_(static|shared)_consumer)$' `
            --output-on-failure --no-tests=error 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-aoti-evidence/aoti-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify an affine package through the public builder
        run: |
          python native-inference/pnms-model-builder build affine `
            --executor local --device cpu --backend aoti `
            --runtime "$env:RUNNER_TEMP/inference-windows-aoti-build/physicsnemo-infer.exe" `
            --output "$env:RUNNER_TEMP/inference-windows-affine" --json 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/inference-windows-aoti-evidence/affine-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows AOTI qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inference-windows-aoti-${{ github.sha }}
          path: |
            ${{ runner.temp }}/inference-windows-aoti-evidence/
            ${{ runner.temp }}/inference-windows-aoti-build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/inference-windows-affine/

  e2s-zarr-io-parity:
    name: E2S Zarr IO Parity
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
      - run: uv run pytest crates/e2s_zarr_io/parity/suites -v

  scicomp-rq-test:
    name: scicomp-rq Tests
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          cache: false
      - name: Run scicomp-rq tests
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install pytest pytest-asyncio maturin
          maturin develop --manifest-path crates/scicomp-rq/Cargo.toml --features python-extension
          pytest crates/scicomp-rq/tests -v
