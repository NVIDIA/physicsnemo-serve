name: Lepton QA

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Docker Build & Publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full image reference or short tag (e.g., pr-5-abc1234)"
        required: true
      suite:
        description: "Which suite(s) to run"
        default: "all"
        type: choice
        options:
          - all
          - cicd
          - crps
          - benchmark

concurrency:
  group: lepton-qa-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ─── Gate: auth, PR info, Docker check, parse command ───────────────
  gate:
    name: Gate
    runs-on: linux-amd64-cpu4
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/lepton-all') ||
        contains(github.event.comment.body, '/lepton-cicd') ||
        contains(github.event.comment.body, '/lepton-crps') ||
        contains(github.event.comment.body, '/lepton-benchmark')))
    outputs:
      run_cicd: ${{ steps.parse.outputs.run_cicd }}
      run_crps: ${{ steps.parse.outputs.run_crps }}
      run_benchmark: ${{ steps.parse.outputs.run_benchmark }}
      image_tag: ${{ steps.image.outputs.tag }}
      sha: ${{ steps.pr.outputs.sha || steps.wr.outputs.sha }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Check commenter authorization
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission --jq '.permission')
          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "write" ]]; then
            echo "::error::User ${{ github.event.comment.user.login }} does not have write access (got: $PERMISSION)"
            exit 1
          fi

      - name: Get PR details
        if: github.event_name == 'issue_comment'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          SHA=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.head.sha')
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=pr-${PR_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Get workflow_run details
        if: github.event_name == 'workflow_run'
        id: wr
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Check Docker build status
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=${{ steps.pr.outputs.sha }}
          CONCLUSION=$(gh api repos/${{ github.repository }}/commits/$SHA/check-runs \
            --jq '.check_runs[] | select(.name == "Build & Push to NGC") | .conclusion' | head -1)
          if [[ "$CONCLUSION" != "success" ]]; then
            gh pr comment ${{ steps.pr.outputs.number }} \
              --body "Cannot run Lepton QA: Docker image build has not succeeded for commit \`${SHA:0:7}\`. Current status: \`${CONCLUSION:-not found}\`. Please ensure the **Docker Build & Publish** check passes first."
            exit 1
          fi

      - name: Parse command
        id: parse
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SUITE="${{ inputs.suite }}"
            case "$SUITE" in
              all)
                echo "run_cicd=true" >> "$GITHUB_OUTPUT"
                echo "run_crps=true" >> "$GITHUB_OUTPUT"
                echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
                ;;
              cicd)
                echo "run_cicd=true" >> "$GITHUB_OUTPUT"
                echo "run_crps=false" >> "$GITHUB_OUTPUT"
                echo "run_benchmark=false" >> "$GITHUB_OUTPUT"
                ;;
              crps)
                echo "run_cicd=false" >> "$GITHUB_OUTPUT"
                echo "run_crps=true" >> "$GITHUB_OUTPUT"
                echo "run_benchmark=false" >> "$GITHUB_OUTPUT"
                ;;
              benchmark)
                echo "run_cicd=false" >> "$GITHUB_OUTPUT"
                echo "run_crps=false" >> "$GITHUB_OUTPUT"
                echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "run_cicd=true" >> "$GITHUB_OUTPUT"
            echo "run_crps=true" >> "$GITHUB_OUTPUT"
            echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
          else
            COMMENT="${{ github.event.comment.body }}"
            RUN_CICD=false
            RUN_CRPS=false
            RUN_BENCHMARK=false
            if echo "$COMMENT" | grep -q '/lepton-all'; then
              RUN_CICD=true
              RUN_CRPS=true
              RUN_BENCHMARK=true
            fi
            if echo "$COMMENT" | grep -q '/lepton-cicd'; then
              RUN_CICD=true
            fi
            if echo "$COMMENT" | grep -q '/lepton-crps'; then
              RUN_CRPS=true
            fi
            if echo "$COMMENT" | grep -q '/lepton-benchmark'; then
              RUN_BENCHMARK=true
            fi
            echo "run_cicd=$RUN_CICD" >> "$GITHUB_OUTPUT"
            echo "run_crps=$RUN_CRPS" >> "$GITHUB_OUTPUT"
            echo "run_benchmark=$RUN_BENCHMARK" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine image tag
        id: image
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            TAG="sha-${SHORT_SHA}"
          else
            TAG="${{ steps.pr.outputs.image_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set pending statuses
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=${{ steps.pr.outputs.sha }}
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          set_status() {
            gh api repos/${{ github.repository }}/statuses/$SHA \
              -f state="$1" -f context="$2" -f description="$3" -f target_url="$RUN_URL"
          }

          if [[ "${{ steps.parse.outputs.run_cicd }}" == "true" ]]; then
            set_status pending "Lepton QA (cicd)" "Queued"
          fi
          if [[ "${{ steps.parse.outputs.run_crps }}" == "true" ]]; then
            set_status pending "Lepton QA (crps)" "Queued"
          fi
          if [[ "${{ steps.parse.outputs.run_benchmark }}" == "true" ]]; then
            set_status pending "Lepton QA (benchmark)" "Queued"
          fi

  # ─── CICD: deploy → pytest → teardown ──────────────────────────────
  cicd:
    name: Lepton QA (cicd)
    needs: [gate]
    runs-on: linux-amd64-cpu4
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.run_cicd == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha || github.sha }}

      - uses: astral-sh/setup-uv@v3

      - name: Install Lepton CLI
        run: |
          uv tool install leptonai
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run CICD tests
        env:
          LEPTON_WORKSPACE_TOKEN: ${{ secrets.LEPTON_WORKSPACE_TOKEN }}
          LEPTON_WORKSPACE_ID: ${{ secrets.LEPTON_WORKSPACE_ID }}
          LEPTON_NODE_GROUP: ${{ secrets.LEPTON_NODE_GROUP }}
          LEPTON_PULL_SECRET: ${{ secrets.PULL_SECRET }}
          LEPTON_HF_TOKEN_SECRET: ${{ vars.LEPTON_HF_TOKEN_SECRET }}
          NFS_MOUNT_BASE: ${{ vars.NFS_MOUNT_BASE }}
          DOCKER_REGISTRY: ${{ vars.NGC_REGISTRY }}/${{ secrets.NGC_ORG }}
          IMAGE_NAME: ${{ secrets.NGC_IMAGE }}
          PULL_SECRET: ${{ secrets.PULL_SECRET }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/python/e2s_tools
        run: |
          IMAGE_TAG="${{ needs.gate.outputs.image_tag }}"
          if [[ "$IMAGE_TAG" == *"/"* ]]; then
            FULL_IMAGE="$IMAGE_TAG"
          else
            FULL_IMAGE="${{ vars.NGC_REGISTRY }}/${{ secrets.NGC_ORG }}/${{ secrets.NGC_IMAGE }}:${IMAGE_TAG}"
          fi
          uv run --extra qa python -u qa/scripts/run_qa.py \
            --service rust \
            --image-tag "$FULL_IMAGE" \
            --suite cicd

  # ─── CRPS: deploy baseline + candidate, compare ────────────────────
  crps:
    name: Lepton QA (crps)
    needs: [gate, cicd]
    runs-on: linux-amd64-cpu4
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.run_crps == 'true' && (needs.cicd.result == 'success' || needs.cicd.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha || github.sha }}

      - uses: astral-sh/setup-uv@v3

      - name: Install Lepton CLI
        run: |
          uv tool install leptonai
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run CRPS comparison
        env:
          LEPTON_WORKSPACE_TOKEN: ${{ secrets.LEPTON_WORKSPACE_TOKEN }}
          LEPTON_WORKSPACE_ID: ${{ secrets.LEPTON_WORKSPACE_ID }}
          LEPTON_NODE_GROUP: ${{ secrets.LEPTON_NODE_GROUP }}
          LEPTON_PULL_SECRET: ${{ secrets.PULL_SECRET }}
          LEPTON_HF_TOKEN_SECRET: ${{ vars.LEPTON_HF_TOKEN_SECRET }}
          NFS_MOUNT_BASE: ${{ vars.NFS_MOUNT_BASE }}
          DOCKER_REGISTRY: ${{ vars.NGC_REGISTRY }}/${{ secrets.NGC_ORG }}
          IMAGE_NAME: ${{ secrets.NGC_IMAGE }}
          PYTHON_SERVICE_IMAGE: ${{ vars.PYTHON_SERVICE_IMAGE }}
          PULL_SECRET: ${{ secrets.PULL_SECRET }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/python/e2s_tools
        run: |
          IMAGE_TAG="${{ needs.gate.outputs.image_tag }}"
          if [[ "$IMAGE_TAG" == *"/"* ]]; then
            FULL_IMAGE="$IMAGE_TAG"
          else
            FULL_IMAGE="${{ vars.NGC_REGISTRY }}/${{ secrets.NGC_ORG }}/${{ secrets.NGC_IMAGE }}:${IMAGE_TAG}"
          fi
          uv run --extra qa python -u qa/scripts/run_lepton_crps_compare.py \
            --candidate-image-tag "$FULL_IMAGE" \
            --candidate-service rust \
            --baseline-service python \
            --candidate-resource-shape gpu.4xh100-sxm

  # ─── Benchmark: submit batch job ───────────────────────────────────
  benchmark:
    name: Lepton QA (benchmark)
    needs: [gate, crps]
    runs-on: linux-amd64-cpu4
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.run_benchmark == 'true' && (needs.crps.result == 'success' || needs.crps.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha || github.sha }}

      - uses: astral-sh/setup-uv@v3

      - name: Install Lepton CLI
        run: |
          uv tool install leptonai
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Rust IO benchmark
        env:
          LEPTON_WORKSPACE_TOKEN: ${{ secrets.LEPTON_WORKSPACE_TOKEN }}
          LEPTON_WORKSPACE_ID: ${{ secrets.LEPTON_WORKSPACE_ID }}
          LEPTON_NODE_GROUP: ${{ secrets.LEPTON_NODE_GROUP }}
          LEPTON_PULL_SECRET: ${{ secrets.PULL_SECRET }}
          NFS_MOUNT_BASE: ${{ vars.NFS_MOUNT_BASE }}
          DOCKER_REGISTRY: ${{ vars.NGC_REGISTRY }}/${{ secrets.NGC_ORG }}
          IMAGE_NAME: ${{ secrets.NGC_IMAGE }}
          PULL_SECRET: ${{ secrets.PULL_SECRET }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/python/e2s_tools
        run: |
          uv run --extra qa python -u qa/scripts/run_lepton_rust_io_benchmark.py \
            --image-tag "${{ needs.gate.outputs.image_tag }}" \
            --preset benchmark-report

  # ─── Report final status back to PR ────────────────────────────────
  report-status:
    name: Report Status
    needs: [gate, cicd, crps, benchmark]
    runs-on: linux-amd64-cpu4
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.sha != ''
    steps:
      - name: Report commit statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=${{ needs.gate.outputs.sha }}
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          set_status() {
            gh api repos/${{ github.repository }}/statuses/$SHA \
              -f state="$1" -f context="$2" -f description="$3" -f target_url="$RUN_URL"
          }

          report_job() {
            local JOB_RESULT="$1"
            local CONTEXT="$2"
            local WAS_REQUESTED="$3"

            if [[ "$WAS_REQUESTED" != "true" ]]; then
              return
            fi

            case "$JOB_RESULT" in
              success)  set_status success "$CONTEXT" "Passed" ;;
              skipped)  set_status success "$CONTEXT" "Skipped (dependency not met)" ;;
              *)        set_status failure "$CONTEXT" "Failed" ;;
            esac
          }

          report_job "${{ needs.cicd.result }}" "Lepton QA (cicd)" "${{ needs.gate.outputs.run_cicd }}"
          report_job "${{ needs.crps.result }}" "Lepton QA (crps)" "${{ needs.gate.outputs.run_crps }}"
          report_job "${{ needs.benchmark.result }}" "Lepton QA (benchmark)" "${{ needs.gate.outputs.run_benchmark }}"
