name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    name: Rust Format
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      # TODO: update to latest stable once GitLab CI is also upgraded
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          components: rustfmt
          cache: false
      - run: cargo fmt --check

  rust-clippy:
    name: Rust Clippy
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          components: clippy
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy -- -D warnings

  rust-build:
    name: Rust Build
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - run: cargo build

  rust-test:
    name: Rust Test
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-yaml redis-server
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python
      - run: cargo test

  python-lint:
    name: Python Lint
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  python-test:
    name: Python Tests
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/python/e2s_tools
        run: uv run pytest tests python/e2s_tools qa/scripts/test_rust_io_benchmark.py -v

  e2s-zarr-io-parity:
    name: E2S Zarr IO Parity
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
      - run: uv run pytest crates/e2s_zarr_io/parity/suites -v

  scicomp-rq-test:
    name: scicomp-rq Tests
    runs-on: linux-amd64-cpu8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: "1.94.1"
          cache: false
      - name: Run scicomp-rq tests
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install pytest pytest-asyncio maturin
          maturin develop --manifest-path crates/scicomp-rq/Cargo.toml --features python-extension
          pytest crates/scicomp-rq/tests -v
