# PhysicsNeMo Serve Observability — Grafana Dashboard
#
# Usage:
#   SERVICE_URL=https://your-deployment.lepton.run \
#   EP_TOKEN=your-bearer-token \
#   docker compose -f observability/docker-compose.yml up
#
# Then open http://localhost:3000

services:
  grafana:
    image: grafana/grafana-oss:11.6.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/physicsnemo-serve-overview.json
      - SERVICE_URL=${SERVICE_URL:?Set SERVICE_URL to your Lepton deployment URL}
      - EP_TOKEN=${EP_TOKEN:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
