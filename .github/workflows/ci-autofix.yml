#
# CI autofix agent. Design: docs/plans/2026-10-21-ci-autofix-agent-design.md
#
# workflow_run and issue_comment always run this file and .github/autofix/ from
# the default branch, so a PR cannot change what the agent may do. Use
# workflow_dispatch with --ref to try changes from a branch.
#
# Repository configuration:
#   vars.AUTOFIX_MODE              dry-run (default) | push
#   vars.AUTOFIX_MODEL             LiteLLM model name, e.g. openai/<model>
#   vars.AUTOFIX_API_BASE          OpenAI-compatible endpoint for the model
#   vars.AUTOFIX_MODEL_CLASS       optional: litellm (tool calls, default) | litellm_textbased
#   secrets.AUTOFIX_API_KEY        key for the model endpoint
#   vars.AUTOFIX_APP_ID            GitHub App used to push (push mode only)
#   secrets.AUTOFIX_APP_PRIVATE_KEY

name: CI Autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
      ci_run_id:
        description: "Failed CI run ID to fix"
        required: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

env:
  STATE_DIR: ${{ github.workspace }}/autofix-state
  PYTHONPATH: ${{ github.workspace }}/tooling/.github/autofix
  PYTHON_VERSION: "3.12"
  # Pinned together: litellm imports mcp whenever tools are passed, which
  # mini-swe-agent always does, and mini-swe-agent does not depend on mcp.
  MINI_SWE_AGENT_VERSION: "2.4.6"
  LITELLM_VERSION: "1.106.2"
  MCP_VERSION: "2.3.0"

jobs:
  gate:
    name: Gate
    runs-on: linux-amd64-cpu4
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/autofix')) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          sparse-checkout: .github/autofix
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - name: Decide whether to act
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUTS: ${{ toJSON(inputs) }}
        run: >-
          uv run --no-project --python "$PYTHON_VERSION" --with pyyaml
          python -m ci_autofix gate
          --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH"
          --inputs "$INPUTS" --mode "${{ vars.AUTOFIX_MODE || 'dry-run' }}"
          --state-dir "$STATE_DIR"
      - name: Explain the skip on the PR
        if: steps.gate.outputs.proceed != 'true' && steps.gate.outputs.notify == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python "$PYTHON_VERSION" --with pyyaml
          python -m ci_autofix report --state-dir "$STATE_DIR"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: autofix-gate
          path: autofix-state/state.json

  fix:
    name: Fix
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 120
    concurrency:
      group: ci-autofix-pr-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          sparse-checkout: .github/autofix
          persist-credentials: false
      - name: Check out the PR head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: autofix-gate
          path: autofix-state
      - uses: astral-sh/setup-uv@v3
      - name: Build the sandbox image
        run: docker build -t ci-autofix-env:local tooling/.github/autofix
      - name: Triage, run the agent, and validate
        id: fix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOFIX_MODEL: ${{ vars.AUTOFIX_MODEL }}
          AUTOFIX_API_BASE: ${{ vars.AUTOFIX_API_BASE }}
          AUTOFIX_MODEL_CLASS: ${{ vars.AUTOFIX_MODEL_CLASS }}
          AUTOFIX_API_KEY: ${{ secrets.AUTOFIX_API_KEY }}
          MSWEA_SILENT_STARTUP: "1"
          MSWEA_MODEL_RETRY_STOP_AFTER_ATTEMPT: "3"
        run: >-
          uv run --no-project --python "$PYTHON_VERSION"
          --with pyyaml --with "mini-swe-agent==$MINI_SWE_AGENT_VERSION"
          --with "litellm==$LITELLM_VERSION" --with "mcp==$MCP_VERSION"
          python -m ci_autofix fix
          --state-dir "$STATE_DIR" --head "$GITHUB_WORKSPACE/head" --image ci-autofix-env:local
      - name: Mint a push token
        id: app-token
        if: steps.fix.outputs.outcome == 'fixed' && vars.AUTOFIX_MODE == 'push'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
      - name: Push the fix to the PR branch
        id: push
        if: steps.app-token.outcome == 'success'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          set -uo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          if git -C head -c "http.extraheader=$auth" push "$remote" "HEAD:refs/heads/${HEAD_REF}"; then
            echo "result=pushed" >> "$GITHUB_OUTPUT"
          else
            current=$(git -C head -c "http.extraheader=$auth" ls-remote "$remote" "refs/heads/${HEAD_REF}" | cut -f1)
            if [ "$current" != "$HEAD_SHA" ]; then
              echo "result=branch-moved" >> "$GITHUB_OUTPUT"
            else
              echo "result=failed" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Report on the PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python "$PYTHON_VERSION" --with pyyaml
          python -m ci_autofix report --state-dir "$STATE_DIR"
          --push-result "${{ steps.push.outputs.result || 'skipped' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autofix-pr-${{ needs.gate.outputs.pr_number }}-run-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            autofix-state/state.json
            autofix-state/task.md
            autofix-state/agent/
            autofix-state/*.diff
