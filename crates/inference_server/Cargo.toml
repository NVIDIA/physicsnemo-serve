[package]
name = "inference_server"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "inference_server"
path = "src/main.rs"
required-features = ["rest"]

[features]
default = ["rest"]
rest = [
    "dep:axum",
    "dep:jsonschema",
    "dep:nvml-wrapper",
    "dep:prometheus-client",
    "dep:redis",
    "dep:scicomp-rq",
    "dep:sysinfo",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"], optional = true }
tower = { version = "0.5.2", optional = true }
tower-http = { version = "0.5", features = ["cors", "limit", "trace"], optional = true }

# Async runtime
tokio = { workspace = true, features = ["fs"], optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Error handling
anyhow = { workspace = true }

# Utilities
uuid = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }

# Logging
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Redis (via scicomp-rq)
scicomp-rq = { path = "../scicomp-rq", optional = true }
redis = { workspace = true, optional = true }

# Metrics / Observability
prometheus-client = { workspace = true, optional = true }
nvml-wrapper = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

# HTTP client (for Prometheus proxy)
reqwest = { version = "0.12", features = ["json"] }
