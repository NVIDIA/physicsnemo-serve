include:
  - component: $CI_SERVER_FQDN/scicomp/ci/devops/mr-workflow@2
  - component: $CI_SERVER_FQDN/scicomp/ci/rust/rust@main
  - project: "scicomp/common/gitlab-templates"
    ref: main
    file:
      - /templates/vars/vars.yml
      - /templates/container/container.yml
  - component: $CI_SERVER_FQDN/scicomp/ci/python/python@main
    inputs:
      project_root_dir: "$CI_PROJECT_DIR"
  - component: $CI_SERVER_FQDN/scicomp/ci/vault/client@2
  # https://gitlab-master.nvidia.com/security/devops-tools/ci-cd-components/pulse-container-scanner/-/blob/main/templates/scan-image.yml?ref_type=heads
  - component: $CI_SERVER_FQDN/security/devops-tools/ci-cd-components/pulse-container-scanner/scan-image@2
    inputs:
      stage: dev-sec-ops
      job_prefix: .scan-image
      nspect_id: $NSPECT_ID
      container_image: ''
      use_default_policy: true
      enable_override: true
      program_version: main
      tags: []
      rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
        - if: $CI_COMMIT_TAG
          variables:
            IS_RELEASE: true
            PROGRAM_VERSION: $CI_COMMIT_TAG
        - when: manual
          variables:
            ENABLE_OVERRIDE: false
      vault_addr: &vault_addr https://stg.vault.nvidia.com
      vault_auth_path: &vault_auth_path auth/jwt/nvidia/gitlab-master
      vault_auth_role: &vault_auth_role default
      vault_template_0_dst: &vault_template_0_dst ${CI_PROJECT_DIR}/ssa.env
      vault_template_0_cnt: &vault_template_0_cnt |
        {{- with secret "ssa/prd/scicomp-infra/pulse-scan/issue/creds" }}
        export SSA_CLIENT_ID={{ .Data.client_id }}
        export SF_CLIENT_ID={{ .Data.client_id }}
        export SSA_CLIENT_SECRET={{ .Data.secret }}
        export SF_CLIENT_SECRET={{ .Data.secret }}
        {{- end }}
        {{- with secret "/kv/infra/ngc/scicomp-dev" }}
        export PULSE_REGISTRY_NGC_PASSWORD='{{ .Data.data.password }}'
        export IMAGE_REPO_PASS='{{ .Data.data.password }}'
        {{- end }}
        export PULSE_REGISTRY_NGC_USER='$oauthtoken'
        export IMAGE_REPO_USER='$oauthtoken'
        export IMAGE_REPO=nvcr.io
  # https://gitlab-master.nvidia.com/security/devops-tools/ci-cd-components/pulse-open-source-scanner/-/blob/main/templates/scan.yml?ref_type=heads
  - component: $CI_SERVER_FQDN/security/devops-tools/ci-cd-components/pulse-open-source-scanner/scan@1
    inputs:
      stage: dev-sec-ops
      nspect_id: $NSPECT_ID
      project: $CI_PROJECT_NAME
      project_version: main
      repo_branch: main
      override: "true"
      allow_failure: true
      rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
        - if: $CI_COMMIT_TAG
          variables:
            PULSE_SCAN_PROJECT_VERSION: $CI_COMMIT_TAG
        - when: manual
      tags: []
      job_name: scan-source
      vault_addr: *vault_addr
      vault_auth_path: *vault_auth_path
      vault_auth_role: *vault_auth_role
      vault_template_0_dst: *vault_template_0_dst
      vault_template_0_cnt: *vault_template_0_cnt

variables:
  NSPECT_ID: NSPECT-1NIV-SEMO
  NGC_IMAGE: scicomp-ferroflux
  VAULT_ADDR: https://stg.vault.nvidia.com
  VAULT_SERVER_URL: https://stg.vault.nvidia.com
  VAULT_AUTH_PATH: auth/jwt/nvidia/gitlab-master
  VAULT_AUTH_ROLE: default
  VAULT_JWT_MOUNT_PATH: auth/jwt/nvidia/gitlab-master
  VAULT_JWT_ROLE: default
  VAULT_NAMESPACE: scicomp-dev


stages:
  - init
  - test
  - publish-base
  - publish
  - integration-tests
  - deploy
  - dev-sec-ops

prepare-ci:
  stage: init
  extends: .next-git-tag

python init:
  extends: .python
  stage: .pre
  script:
    - uv pip install setuptools --system
    - uv pip install torch --system

.python:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential
    - rm -rf /var/lib/apt/lists/*

.rust-project:
  stage: test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-yaml redis-server && rm -rf /var/lib/apt/lists/*
    - ln -sf /usr/bin/python3 /usr/local/bin/python
    - cd "$CI_PROJECT_DIR"

cargo fetch:
  extends: [.cargo fetch, .rust-project]

cargo fmt:
  extends: [.cargo fmt, .rust-project]

cargo clippy:
  extends: [.cargo clippy, .rust-project]
  variables:
    CLIPPY_ARGS: "-D warnings"

cargo build:
  extends: [.cargo build, .rust-project]

cargo test:
  extends: [.cargo test, .rust-project]

python_tools_tests:
  extends: .python
  stage: test
  script:
    - cd "$CI_PROJECT_DIR"
    - export PYTHONPATH="$CI_PROJECT_DIR:$CI_PROJECT_DIR/python/e2s_tools"
    - uv run pytest tests python/e2s_tools qa/scripts/test_rust_io_benchmark.py -v

python lint:
  extends: .python
  stage: test
  script:
    - cd "$CI_PROJECT_DIR"
    - uv run ruff check .
    - uv run ruff format --check .

e2s_zarr_io_parity:
  extends: .python
  stage: test
  script:
    - cd "$CI_PROJECT_DIR"
    - uv run pytest crates/e2s_zarr_io/parity/suites -v

scicomp_rq_tests:
  stage: test
  image: ghcr.io/pyo3/maturin:latest
  before_script:
    - cd "$CI_PROJECT_DIR"
  script:
    - PY3=$(ls /opt/python/cp311*/bin/python3 /opt/python/cp312*/bin/python3 /opt/python/cp313*/bin/python3 2>/dev/null | sort -V | tail -1)
    - $PY3 -m venv .venv
    - . .venv/bin/activate
    - pip install pytest pytest-asyncio
    - maturin develop --manifest-path crates/scicomp-rq/Cargo.toml --features python-extension
    - pytest crates/scicomp-rq/tests -v

scicomp-rq wheel:
  stage: publish
  image: ghcr.io/pyo3/maturin:latest
  before_script:
    - cd "$CI_PROJECT_DIR"
  script:
    - mkdir -p "$CI_PROJECT_DIR/dist/scicomp-rq"
    - PY_INTERPRETERS=$(ls /opt/python/cp311*/bin/python3 /opt/python/cp312*/bin/python3 /opt/python/cp313*/bin/python3 2>/dev/null | sort -V)
    - test -n "$PY_INTERPRETERS"
    - maturin build --manifest-path "$CI_PROJECT_DIR/crates/scicomp-rq/Cargo.toml" --features python-extension --release --compatibility off -i $PY_INTERPRETERS --out "$CI_PROJECT_DIR/dist/scicomp-rq"
    - ls -1 "$CI_PROJECT_DIR/dist/scicomp-rq/"*.whl
  artifacts:
    when: always
    paths:
      - dist/scicomp-rq/*.whl
    expire_in: 1 week

e2s_zarr_io wheel:
  stage: publish
  image: ghcr.io/pyo3/maturin:latest
  before_script:
    - cd "$CI_PROJECT_DIR"
  script:
    - mkdir -p "$CI_PROJECT_DIR/dist/e2s_zarr_io"
    - maturin build --manifest-path "$CI_PROJECT_DIR/crates/e2s_zarr_io/Cargo.toml" --features python-extension-module --release --compatibility off --find-interpreter --out "$CI_PROJECT_DIR/dist/e2s_zarr_io"
    - ls -1 "$CI_PROJECT_DIR/dist/e2s_zarr_io/"*.whl
  artifacts:
    when: always
    paths:
      - dist/e2s_zarr_io/*.whl
    expire_in: 1 week

runtime_base_image_build:
  extends: .image_build
  stage: publish-base
  timeout: 2h
  id_tokens:
    VAULT_JWT_TOKEN:
      aud: https://stg.vault.nvidia.com
  rules:
    - changes:
        - Dockerfile.Earth2Studio.runtime-base
        - .gitlab-ci.yml
  variables:
    NGC_IMAGE: scicomp-ferroflux-runtime-base
    DOCKER_FILE_PATH: Dockerfile.Earth2Studio.runtime-base
    IMAGE_TAG: "pytorch-26.01-py3-th0.8.1"
    TAR_PATH: ./runtime-base-container.tar
    EXTRA_PARAMS: "--snapshot-mode=redo --cache-ttl=168h --build-arg PYTORCH_BASE_IMAGE=${NGC_REGISTRY}/${NGC_ORG}/pytorch:26.01-py3"
  before_script:
    - export VAULT_ADDR="https://stg.vault.nvidia.com"
    - export VAULT_JWT_MOUNT_PATH="auth/jwt/nvidia/gitlab-master"
    - export VAULT_JWT_ROLE="default"
    - export VAULT_NAMESPACE="scicomp"
    - !reference [.scicomp:vault:utils, setup]
    - osec_vault_request_secret NGC_REGISTRY_PASSWORD /kv/infra/ngc/scicomp-dev .Data.data.password
    - osec_vault_get_secrets
    - echo "machine $CI_SERVER_HOST login gitlab-ci-token password $CI_JOB_TOKEN" >> .netrc

image_build:
  extends: .image_build
  stage: publish
  timeout: 2h
  id_tokens:
    VAULT_JWT_TOKEN:
      aud: https://stg.vault.nvidia.com
  needs:
    - job: prepare-ci
      artifacts: true
    - job: runtime_base_image_build
      optional: true
  variables:
    DOCKER_FILE_PATH: Dockerfile.Earth2Studio.scicomp-rust-slim
    IMAGE_TAG: "${GIT_TAG}"
    TAR_PATH: ./container.tar
    EXTRA_PARAMS: "--snapshot-mode=redo --cache-ttl=168h --build-arg PHYSICSNEMO_SERVE_RUNTIME_BASE_IMAGE=${NGC_REGISTRY}/${NGC_ORG}/scicomp-ferroflux-runtime-base:pytorch-26.01-py3-th0.8.1"
  before_script:
    - export VAULT_ADDR="https://stg.vault.nvidia.com"
    - export VAULT_JWT_MOUNT_PATH="auth/jwt/nvidia/gitlab-master"
    - export VAULT_JWT_ROLE="default"
    - export VAULT_NAMESPACE="scicomp"
    - !reference [.scicomp:vault:utils, setup]
    - osec_vault_request_secret NGC_REGISTRY_PASSWORD /kv/infra/ngc/scicomp-dev .Data.data.password
    - osec_vault_get_secrets
    - echo "machine $CI_SERVER_HOST login gitlab-ci-token password $CI_JOB_TOKEN" >> .netrc

scan-image:
  extends: .scan-image
  needs:
    - job: prepare-ci
      artifacts: true
    - job: image_build
      artifacts: true
  variables:
    CONTAINER_IMAGE: "${NGC_REGISTRY}/${NGC_ORG}/${NGC_IMAGE}:${GIT_TAG}"
    CONTAINER_ARCHIVE: "${CI_PROJECT_DIR}/container.tar"
    VAULT_REGISTRY_KV_PATHS: kv/infra/ngc/scicomp-dev
    VAULT_NAMESPACE: scicomp
    DOCKER_CONFIG: "${CI_PROJECT_DIR}/.docker"
    REGISTRY_AUTH_FILE: "${CI_PROJECT_DIR}/.docker/config.json"
  before_script:
    - !reference [.scan-image, before_script]
    - if [ -f "${CI_PROJECT_DIR}/ssa.env" ]; then . "${CI_PROJECT_DIR}/ssa.env"; fi
    - if [ -z "${PULSE_REGISTRY_NGC_PASSWORD:-}" ]; then export PULSE_REGISTRY_NGC_PASSWORD="$(vault kv get -field=password "$VAULT_REGISTRY_KV_PATHS" || true)"; fi
    - export PULSE_REGISTRY_NGC_USER="${PULSE_REGISTRY_NGC_USER:-\$oauthtoken}"
    - export IMAGE_REPO_PASS="${IMAGE_REPO_PASS:-$PULSE_REGISTRY_NGC_PASSWORD}"
    - export IMAGE_REPO_USER="${IMAGE_REPO_USER:-$PULSE_REGISTRY_NGC_USER}"
    - export IMAGE_REPO="${IMAGE_REPO:-nvcr.io}"
    - test -n "$PULSE_REGISTRY_NGC_PASSWORD" || (echo "Missing NVCR scan password from Vault path $VAULT_REGISTRY_KV_PATHS field password" && exit 1)
    - mkdir -p "$DOCKER_CONFIG"
    - registry_auth="$(printf "%s:%s" "$PULSE_REGISTRY_NGC_USER" "$PULSE_REGISTRY_NGC_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"nvcr.io":{"auth":"%s"}}}\n' "$registry_auth" > "$REGISTRY_AUTH_FILE"

scan-source:
  variables:
    PULSE_SCAN_EXCLUDE_DETECTORS: PIP

#
# Usage tracking added by security devops components
#

"track-usage: [scan-image]":
  extends: .scan-image-track-usage
  rules: &track-usage-rules [{if: $CI_PIPELINE_SOURCE == 'schedule'}]

track-scan-template-usage-scan-source:
  rules: [{when: never}]

"track-usage: [scan-source]":
  extends: track-scan-template-usage-scan-source
  rules: *track-usage-rules

track-template-usage:
  rules: [{when: never}]

"track-usage: [vault-sidecar]":
  extends: track-template-usage
  rules: *track-usage-rules

.physicsnemo-serve-qa-vault:
  extends: .vault:stg
  variables:
    QA_IMAGE_TAG: "${GIT_TAG}"
    VAULT_AUTH_ROLE: *vault_auth_role

inference qa:
  extends: .physicsnemo-serve-qa-vault
  stage: integration-tests
  image: python:3.11
  when: manual
  needs:
    - !reference [.vault:client, needs]
    - job: prepare-ci
      artifacts: true
    - job: image_build
      artifacts: false
  variables:
    QA_SOURCE_DIR: qa
    QA_SERVICE: rust
    QA_SUITE: cicd
    QA_NUM_PROC: "1"
    QA_LUSTRE_DIR: cicd
    QA_ARTIFACT_DIR: artifacts
    QA_STREAM_ENDPOINT_LOGS: "true"
    QA_ENDPOINT_LOG_INTERVAL: "30"
  before_script:
    - !reference [.vault:client, before_script]
    - set +x
    - LEPTON_WORKSPACE_TOKEN="$(vault kv get -mount=kv/infra -field=lepton_workspace_token ferroflux/qa/dev)"
    - export LEPTON_WORKSPACE_TOKEN
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r "$QA_SOURCE_DIR/inference/requirements.txt"
    - mkdir -p "$QA_SOURCE_DIR/$QA_ARTIFACT_DIR" "$QA_SOURCE_DIR/inference/logs" "$QA_SOURCE_DIR/inference/reports"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - qa/artifacts/
      - qa/inference/logs/
      - qa/inference/reports/
  script:
    - set -eu
    - export USER="${USER:-${GITLAB_USER_LOGIN:-ci}}"
    - export LEPTON_WORKSPACE_TOKEN="${LEPTON_WORKSPACE_TOKEN:-}"
    - export LEPTON_ENDPOINT_TOKEN="${LEPTON_ENDPOINT_TOKEN:-}"
    - |
      if [ -z "$LEPTON_WORKSPACE_TOKEN" ]; then
        echo "LEPTON_WORKSPACE_TOKEN is required."
        exit 1
      fi
    - |
      image_tag="${QA_IMAGE_TAG:-}"
      if [ -z "$image_tag" ]; then
        image_tag="${GIT_TAG:-}"
      fi
      if [ -z "$image_tag" ]; then
        echo "GIT_TAG or QA_IMAGE_TAG is required when running inference QA in the test stage."
        exit 1
      fi
      echo "Running inference QA against image tag: $image_tag"

      qa_args=(
        --service "$QA_SERVICE"
        --image-tag "$image_tag"
        --suite "$QA_SUITE"
        --num-proc "$QA_NUM_PROC"
        --endpoint-log-interval "$QA_ENDPOINT_LOG_INTERVAL"
        --artifact-dir "$QA_SOURCE_DIR/$QA_ARTIFACT_DIR"
        --lustre-dir "$QA_LUSTRE_DIR"
      )

      if [ -n "${QA_ENDPOINT_NAME:-}" ]; then
        qa_args+=(--endpoint-name "$QA_ENDPOINT_NAME")
      fi

      if [ "${QA_SKIP_TEARDOWN:-false}" = "true" ]; then
        qa_args+=(--skip-teardown)
      fi

      if [ "$QA_STREAM_ENDPOINT_LOGS" = "false" ]; then
        qa_args+=(--no-endpoint-logs)
      else
        qa_args+=(--stream-endpoint-logs)
      fi

      python -u "$QA_SOURCE_DIR/scripts/run_qa.py" "${qa_args[@]}"

inference crps compare:
  extends: .physicsnemo-serve-qa-vault
  stage: integration-tests
  image: python:3.11
  when: manual
  needs:
    - !reference [.vault:client, needs]
    - job: prepare-ci
      artifacts: true
    - job: image_build
      artifacts: false
  variables:
    QA_SOURCE_DIR: qa
    QA_ARTIFACT_DIR: artifacts
    QA_BASELINE_IMAGE_TAG: nvcr.io/dycvht5ows21/earth2studio-scicomp:v0.15.0.20260515.0
    QA_CANDIDATE_IMAGE_TAG: nvcr.io/dycvht5ows21/scicomp-ferroflux:v0.1.0
    QA_BASELINE_SERVICE: python
    QA_CANDIDATE_SERVICE: rust
    QA_BASELINE_WORKFLOW: ensemble_workflow
    QA_CANDIDATE_WORKFLOW: earth2-ensemble-fanout
    QA_BASELINE_REQUEST_JSON: qa/inference/requests/crps_baseline_request.json
    QA_CANDIDATE_REQUEST_JSON: qa/inference/requests/crps_candidate_fanout_request.json
    QA_CRPS_THRESHOLD: "0.01"
    QA_RUN_TIMEOUT: "10800"
    QA_RUN_POLL_INTERVAL: "120"
    QA_CANDIDATE_RESOURCE_SHAPE: gpu.4xh100-sxm
    QA_STREAM_ENDPOINT_LOGS: "true"
    QA_ENDPOINT_LOG_INTERVAL: "30"
  before_script:
    - !reference [.vault:client, before_script]
    - set +x
    - LEPTON_WORKSPACE_TOKEN="$(vault kv get -mount=kv/infra -field=lepton_workspace_token ferroflux/qa/dev)"
    - export LEPTON_WORKSPACE_TOKEN
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r "$QA_SOURCE_DIR/inference/requirements.txt"
    - mkdir -p "$QA_SOURCE_DIR/$QA_ARTIFACT_DIR"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - qa/artifacts/
  script:
    - set -eu
    - export USER="${USER:-${GITLAB_USER_LOGIN:-ci}}"
    - export LEPTON_WORKSPACE_TOKEN="${LEPTON_WORKSPACE_TOKEN:-}"
    - export LEPTON_ENDPOINT_TOKEN="${LEPTON_ENDPOINT_TOKEN:-}"
    - |
      if [ -z "$LEPTON_WORKSPACE_TOKEN" ]; then
        echo "LEPTON_WORKSPACE_TOKEN is required."
        exit 1
      fi

      crps_args=(
        --baseline-service "$QA_BASELINE_SERVICE"
        --candidate-service "$QA_CANDIDATE_SERVICE"
        --baseline-image-tag "$QA_BASELINE_IMAGE_TAG"
        --candidate-image-tag "$QA_CANDIDATE_IMAGE_TAG"
        --baseline-workflow "$QA_BASELINE_WORKFLOW"
        --candidate-workflow "$QA_CANDIDATE_WORKFLOW"
        --baseline-request-json "$QA_BASELINE_REQUEST_JSON"
        --candidate-request-json "$QA_CANDIDATE_REQUEST_JSON"
        --threshold "$QA_CRPS_THRESHOLD"
        --run-timeout "$QA_RUN_TIMEOUT"
        --run-poll-interval "$QA_RUN_POLL_INTERVAL"
        --endpoint-log-interval "$QA_ENDPOINT_LOG_INTERVAL"
        --artifact-dir "$QA_SOURCE_DIR/$QA_ARTIFACT_DIR"
      )

      if [ -n "${QA_LUSTRE_DIR:-}" ]; then
        crps_args+=(--lustre-dir "$QA_LUSTRE_DIR")
      fi

      if [ -n "${QA_BASELINE_RESOURCE_SHAPE:-}" ]; then
        crps_args+=(--baseline-resource-shape "$QA_BASELINE_RESOURCE_SHAPE")
      fi

      if [ -n "${QA_CANDIDATE_RESOURCE_SHAPE:-}" ]; then
        crps_args+=(--candidate-resource-shape "$QA_CANDIDATE_RESOURCE_SHAPE")
      fi

      if [ -n "${QA_CRPS_VARIABLES:-}" ]; then
        crps_args+=(--variables "$QA_CRPS_VARIABLES")
      fi

      if [ -n "${QA_COMPARISON_IMAGE_TAG:-}" ]; then
        crps_args+=(--comparison-image-tag "$QA_COMPARISON_IMAGE_TAG")
      fi

      if [ "${QA_SKIP_TEARDOWN:-false}" = "true" ]; then
        crps_args+=(--skip-teardown)
      fi

      if [ "$QA_STREAM_ENDPOINT_LOGS" = "false" ]; then
        crps_args+=(--no-endpoint-logs)
      else
        crps_args+=(--stream-endpoint-logs)
      fi

      python -u "$QA_SOURCE_DIR/scripts/run_lepton_crps_compare.py" "${crps_args[@]}"

rust io benchmark:
  extends: .physicsnemo-serve-qa-vault
  stage: integration-tests
  image: python:3.11
  when: manual
  needs:
    - !reference [.vault:client, needs]
    - job: prepare-ci
      artifacts: true
    - job: image_build
      artifacts: false
  variables:
    QA_SOURCE_DIR: qa
    QA_ARTIFACT_DIR: artifacts
    QA_RUST_IO_PRESET: benchmark-report
    QA_RUST_IO_BACKENDS: rust,py_async,zarr_sync
    QA_RUST_IO_DEVICE: cuda:0
    QA_RUST_IO_RESOURCE_SHAPE: gpu.h100-sxm
    QA_RUST_IO_JOB_TIMEOUT: "21600"
    QA_RUST_IO_JOB_POLL_INTERVAL: "60"
  before_script:
    - !reference [.vault:client, before_script]
    - set +x
    - LEPTON_WORKSPACE_TOKEN="$(vault kv get -mount=kv/infra -field=lepton_workspace_token ferroflux/qa/dev)"
    - export LEPTON_WORKSPACE_TOKEN
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r "$QA_SOURCE_DIR/inference/requirements.txt"
    - mkdir -p "$QA_SOURCE_DIR/$QA_ARTIFACT_DIR"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - qa/artifacts/
  script:
    - set -eu
    - export USER="${USER:-${GITLAB_USER_LOGIN:-ci}}"
    - export LEPTON_WORKSPACE_TOKEN="${LEPTON_WORKSPACE_TOKEN:-}"
    - |
      if [ -z "$LEPTON_WORKSPACE_TOKEN" ]; then
        echo "LEPTON_WORKSPACE_TOKEN is required."
        exit 1
      fi

      image_tag="${QA_IMAGE_TAG:-}"
      if [ -z "$image_tag" ]; then
        image_tag="${GIT_TAG:-}"
      fi
      if [ -z "$image_tag" ]; then
        echo "GIT_TAG or QA_IMAGE_TAG is required."
        exit 1
      fi

      lustre_dir="${QA_RUST_IO_LUSTRE_DIR:-rust_io_tests_${CI_PIPELINE_ID:-manual}}"
      echo "Running Rust I/O benchmark against image tag: $image_tag"

      rust_io_args=(
        --image-tag "$image_tag"
        --preset "$QA_RUST_IO_PRESET"
        --backends "$QA_RUST_IO_BACKENDS"
        --device "$QA_RUST_IO_DEVICE"
        --lustre-dir "$lustre_dir"
        --resource-shape "$QA_RUST_IO_RESOURCE_SHAPE"
        --job-timeout "$QA_RUST_IO_JOB_TIMEOUT"
        --job-poll-interval "$QA_RUST_IO_JOB_POLL_INTERVAL"
        --artifact-dir "$QA_SOURCE_DIR/$QA_ARTIFACT_DIR"
      )

      if [ -n "${QA_RUST_IO_RUN_ID:-}" ]; then
        rust_io_args+=(--run-id "$QA_RUST_IO_RUN_ID")
      fi

      if [ -n "${QA_RUST_IO_MODELS:-}" ]; then
        rust_io_args+=(--models "$QA_RUST_IO_MODELS")
      fi

      if [ -n "${QA_RUST_IO_NSTEPS:-}" ]; then
        rust_io_args+=(--nsteps "$QA_RUST_IO_NSTEPS")
      fi

      if [ -n "${QA_RUST_IO_NODE_GROUP:-}" ]; then
        rust_io_args+=(--node-group "$QA_RUST_IO_NODE_GROUP")
      fi

      if [ -n "${QA_RUST_IO_PULL_SECRET:-}" ]; then
        rust_io_args+=(--pull-secret "$QA_RUST_IO_PULL_SECRET")
      fi

      if [ "${QA_RUST_IO_KEEP_JOB:-false}" = "true" ]; then
        rust_io_args+=(--keep-job)
      fi

      if [ "${QA_RUST_IO_DRY_RUN:-false}" = "true" ]; then
        rust_io_args+=(--dry-run)
      fi

      python -u "$QA_SOURCE_DIR/scripts/run_lepton_rust_io_benchmark.py" "${rust_io_args[@]}"
