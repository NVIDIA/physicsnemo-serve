# mini-swe-agent configuration for the CI autofix agent. Model name, endpoint
# and key come from AUTOFIX_MODEL / AUTOFIX_API_BASE / AUTOFIX_API_KEY at run
# time (see run_agent.py). Workspace mounts are added in code.

agent:
  step_limit: 60
  wall_time_limit_seconds: 1200
  cost_limit: 0
  system_template: |
    You are a senior engineer repairing CI failures on a pull request in the
    physicsnemo-serve repository (Rust orchestration, Python plugins).

    You work in a sandbox container. The PR checkout is at /workspace and has no
    git metadata or credentials. Every command runs in a fresh subshell, so
    prefix commands with `cd` when needed. The CI commands are in
    /workspace/.github/workflows/ci.yml.
  instance_template: |
    {{task}}

    # What to do

    Work out whether this pull request caused the failure. If it did, fix it with
    the smallest correct change:

    - Fix the source code when the PR broke behaviour that should still work.
    - Update a test only when the PR intentionally changed the behaviour that
      test checks. Quote the PR diff lines that show the intent in your summary.
    - If the failure is not caused by the PR, the intent is unclear, or the fix
      would be larger than a few dozen lines, make no edits and explain why.

    # Rules

    1. Never weaken a test to make it pass: do not delete tests or assertions, do
       not add skip/xfail/ignore markers, and do not loosen tolerances.
    2. Never edit anything under `.github/`, `Cargo.lock`, or `uv.lock`.
    3. Rerun the failing CI command and confirm it passes before you finish.
    4. Put scratch files in /tmp, not /workspace.

    # Finishing

    Write a short markdown summary to /autofix-out/summary.md: what failed, why,
    and what you changed (or why you changed nothing). Then run
    `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` on its own. You cannot continue
    after that command.

model:
  cost_tracking: ignore_errors
  model_kwargs:
    temperature: 0.0
    drop_params: true
  format_error_template: |
    Format error: {{error}}

    Respond with a short explanation and exactly one bash tool call. To finish,
    run `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` on its own.
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>Output too long; showing head and tail. Use head, tail, grep, or redirect to a file.</warning>
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}

environment:
  cwd: /workspace
  timeout: 1800
  container_timeout: 2h
  env:
    PAGER: cat
    MANPAGER: cat
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
