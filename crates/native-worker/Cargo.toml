[package]
name = "native-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
cpp = ["dep:cxx", "dep:cxx-build"]

[dependencies]
anyhow.workspace = true
jsonschema.workspace = true
libloading = "0.8"
chrono.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
nvml-wrapper.workspace = true
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
futures = "0.3"
scicomp-rq = { path = "../scicomp-rq" }
worker-runtime = { path = "../worker-runtime" }
cxx = { version = "1", optional = true }

[build-dependencies]
cxx-build = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
