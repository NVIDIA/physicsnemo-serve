#
# CI jobs the autofix agent handles, keyed by the job display name in ci.yml.
# Commands run inside the ci-autofix-env image with the checkout at /workspace.
#
#   runners.<kind>.rerun   reruns failing tests of that kind; {ids} is the
#                          shell-quoted, space-separated list of test IDs.
#   runners.<kind>.cwd     optional working directory relative to /workspace;
#                          "{module_dir}" resolves to the directory holding the
#                          unittest module (see jobs.py).
#   suite                  full check for the job after a fix.
#   autofix                deterministic fix tried before the agent (optional).

jobs:
  "Python Tests":
    env:
      PYTHONPATH: /workspace:/workspace/python/e2s_tools
    runners:
      pytest:
        rerun: uv run pytest -p no:cacheprovider -q {ids}
    suite: uv run pytest -p no:cacheprovider -q tests python/e2s_tools qa/scripts/test_rust_io_benchmark.py

  "Rust Test":
    runners:
      cargo:
        rerun: cargo test -- --exact {ids}
      cargo-build:
        rerun: cargo test --no-run
    suite: cargo test

  "Model Builder and Native SDK CPU":
    runners:
      unittest:
        cwd: "{module_dir}"
        rerun: python3 -S -m unittest -v {ids}
      pytest:
        rerun: /opt/graph-venv/bin/python -m pytest -p no:cacheprovider -q {ids}
        env:
          PYTHONPATH: /workspace/native-inference/model-builder/src
    suite: >-
      python3 -S -m unittest discover -s native-inference/model-builder/tests -p 'test_*.py'
      && PYTHONPATH=/workspace/native-inference/model-builder/src /opt/graph-venv/bin/python -m pytest -q
      native-inference/model-builder/tests/test_tensorrt_exact_graphs.py
      native-inference/model-builder/tests/test_tensorrt_deslice_graphs.py
      native-inference/model-builder/tests/test_tensorrt_domino_graphs.py
      native-inference/model-builder/tests/test_tensorrt_weighted_blend.py

  "Rust Clippy":
    runners:
      clippy:
        rerun: cargo clippy -- -D warnings
    suite: cargo clippy -- -D warnings
    autofix: cargo clippy --fix --allow-dirty --allow-staged --allow-no-vcs

  "Rust Format":
    runners:
      fmt:
        rerun: cargo fmt --check
    suite: cargo fmt --check
    autofix: cargo fmt
