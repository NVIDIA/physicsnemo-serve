[package]
name = "scicomp-rq"
version = "0.1.0"
edition.workspace = true
rust-version = "1.87"
authors.workspace = true
description = "Redis Streams–based distributed task queue for scientific computing pipelines"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/physicsnemo-serve"
keywords = ["redis", "queue", "streams", "async", "distributed"]
categories = ["asynchronous", "science"]
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Python bindings
pyo3 = { workspace = true, features = ["abi3-py311"], optional = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"], optional = true }

[features]
default = []
python = ["pyo3", "pyo3-async-runtimes"]
python-extension = ["python", "pyo3/extension-module"]

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3"

[[bench]]
name = "redis_utils_parser"
harness = false
