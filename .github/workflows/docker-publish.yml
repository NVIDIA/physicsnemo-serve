name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNTIME_BASE_TAG: pytorch-26.01-py3-th0.8.1
  PYTORCH_BASE_IMAGE: nvcr.io/nvidia/pytorch:26.01-py3

jobs:
  docker-publish:
    name: Build & Push to NGC
    runs-on: linux-amd64-cpu16
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/pull-request/* ]]; then
            PR_NUM="${GITHUB_REF#refs/heads/pull-request/}"
            echo "tag=pr-${PR_NUM}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to NGC registry
        run: echo "${{ secrets.NGC_REGISTRY_PASSWORD }}" | docker login ${{ vars.NGC_REGISTRY }} -u '$oauthtoken' --password-stdin

      - name: Set up Docker Buildx
        run: docker buildx create --use --name builder

      - name: Ensure runtime base image exists
        run: |
          BASE_IMAGE="${{ vars.NGC_REGISTRY }}/${{ secrets.NGC_ORG }}/${{ secrets.NGC_RUNTIME_BASE_IMAGE }}:${{ env.RUNTIME_BASE_TAG }}"
          if docker buildx imagetools inspect "${BASE_IMAGE}" >/dev/null 2>&1; then
            echo "Using existing runtime base image: ${BASE_IMAGE}"
          else
            echo "Runtime base image is missing; building ${BASE_IMAGE}"
            docker buildx build \
              -f Dockerfile.physicsnemo-serve.runtime-base \
              --build-arg PYTORCH_BASE_IMAGE=${{ env.PYTORCH_BASE_IMAGE }} \
              -t "${BASE_IMAGE}" \
              --push \
              .
          fi

      - name: Build and push main image
        run: |
          docker buildx build \
            -f Dockerfile.physicsnemo-serve.scicomp-rust-slim \
            --build-arg PHYSICSNEMO_SERVE_RUNTIME_BASE_IMAGE=${{ vars.NGC_REGISTRY }}/${{ secrets.NGC_ORG }}/${{ secrets.NGC_RUNTIME_BASE_IMAGE }}:${{ env.RUNTIME_BASE_TAG }} \
            -t ${{ vars.NGC_REGISTRY }}/${{ secrets.NGC_ORG }}/${{ secrets.NGC_IMAGE }}:${{ steps.tag.outputs.tag }} \
            --push \
            .
